name: Cyrillic build and coverage
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build.py
      - run: python -m pytest tests -q
      - run: git diff --exit-code -- sources
      - run: python scripts/specimen.py
      - uses: actions/upload-artifact@v4
        with:
          name: Doto-Cyrillic
          path: |
            fonts/cyrillic/
            documentation/samples/cyrillic.png
            OFL.txt
